# Пример Nginx для SkinLab на Ubuntu 24.04
# 1) Замените example.com на ваш домен
# 2) Скопируйте: sudo cp deploy/nginx-skinlab.conf /etc/nginx/sites-available/skinlab
# 3) sudo ln -sf /etc/nginx/sites-available/skinlab /etc/nginx/sites-enabled/
# 4) После DNS: sudo certbot --nginx -d example.com
# 5) sudo nginx -t && sudo systemctl reload nginx
#
# Порт 8787 наружу НЕ открывать — только proxy на 127.0.0.1

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Certbot подставит HTTPS; до сертификата можно оставить HTTP для проверки.

    root /home/skinlab/skinlab/public;
    index index.html;

    # Статика Mini App / PWA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health → Fastify (localhost only)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Кэш статики (без SW/HTML)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    client_max_body_size 1m;
}
