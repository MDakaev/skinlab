<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SkinLab · Noir</title>
    <meta name="description" content="Справочник уход-активов: применение, противопоказания, сочетания и типы кожи." />
    <meta name="theme-color" content="#08080f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="icon" href="/assets/favicon-64.png" />
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="aurora__blob aurora__blob--1"></span>
      <span class="aurora__blob aurora__blob--2"></span>
      <span class="aurora__blob aurora__blob--3"></span>
      <span class="aurora__grain"></span>
    </div>

    <header class="head">
      <a class="logo" href="/"><span class="logo__dot"></span>SkinLab<i>noir</i></a>

      <nav class="pillnav" id="nav" aria-label="Разделы">
        <button data-tab="home" class="is-active">Обзор</button>
        <button data-tab="catalog">Активы</button>
        <button data-tab="mix">Лаборатория</button>
      </nav>

      <button class="cta-ghost" id="install" hidden>Установить</button>
    </header>

    <main class="main" id="view" tabindex="-1"></main>

    <div class="modal" id="modal" hidden>
      <div class="modal__scrim" data-close></div>
      <section class="modal__panel" role="dialog" aria-modal="true" aria-label="Карточка актива">
        <button class="modal__close" data-close aria-label="Закрыть">✕</button>
        <div id="modalBody"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
