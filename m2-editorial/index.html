<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SkinLab · Editorial</title>
    <meta name="description" content="Справочник уход-активов: применение, противопоказания, сочетания и типы кожи." />
    <meta name="theme-color" content="#a6432b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="icon" href="/assets/favicon-64.png" />
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="side">
        <a class="masthead" href="/">
          <span class="masthead__title">SkinLab</span>
          <span class="masthead__sub">Издание об активах</span>
        </a>

        <nav class="nav" id="nav" aria-label="Разделы">
          <button data-tab="home" class="is-active"><i>01</i>Обзор</button>
          <button data-tab="catalog"><i>02</i>Указатель</button>
          <button data-tab="scan"><i>03</i>Сканер</button>
          <button data-tab="mix"><i>04</i>Сочетания</button>
        </nav>

        <div class="side__foot">
          <button class="link-btn" id="install" hidden>Установить приложение</button>
          <p class="side__note">Справочная информация. Не заменяет консультацию дерматолога.</p>
        </div>
      </aside>

      <main class="main" id="view" tabindex="-1"></main>

      <aside class="rail" id="rail"></aside>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
